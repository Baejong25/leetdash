name: Recover OpenCode Submission Review

on:
  workflow_run:
    workflows: ["OpenCode Submission Review"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed OpenCode Submission Review run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: recover-opencode-review-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Recover retryable review failure
        run: node scripts/recover-opencode-review.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_RECOVERY_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OPENCODE_RECOVERY_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
