name: DeepSeek V4 Flash Status Check
run-name: deepseek-status-check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
    contents: write

concurrency:
  group: deepseek-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Run status probes
        run: node scripts/check-ai-review-status.mjs --out "$RUNNER_TEMP/status"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      - name: Switch to status-data branch
        run: |
          git fetch origin status-data:refs/remotes/origin/status-data 2>/dev/null || true
          if git rev-parse --verify -q origin/status-data >/dev/null 2>&1; then
            git checkout -B status-data origin/status-data
          else
            git checkout --orphan status-data
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish status to status-data branch
        run: |
          mkdir -p status
          cp "$RUNNER_TEMP/status/gateway-status.json" status/
          cp "$RUNNER_TEMP/status/deepseek-flash-status.json" status/
          git add status/
          if git diff --cached --quiet; then
            echo "No status change."
          else
            git commit -m "Update third-party API status [skip ci]"
            git push origin status-data
          fi
